name: Echidna lws-authn-saml
on:
  pull_request:
    paths: 
      - "lws10-authn-saml/**"
  push:
    branches: [main]
    paths: 
      - "lws10-authn-saml/**"

permissions:
  contents: read

jobs:
  validate:
    name: Build, validate and publish
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: w3c/spec-prod@777b1ac90dbdc8cf822fbf6e5fcfb6d40eb8e653 # v2.13.3
        with:
          SOURCE: lws10-authn-saml/index.html
          TOOLCHAIN: respec
          W3C_WG_DECISION_URL: https://www.w3.org/2026/04/28-lws-minutes.html#0c16
          W3C_BUILD_OVERRIDE: |
             shortName: lws10-authn-saml
             specStatus: WD

  publish:
    name: Publish dated specification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: w3c/spec-prod@777b1ac90dbdc8cf822fbf6e5fcfb6d40eb8e653 # v2.13.3
        with:
          SOURCE: lws10-authn-saml/index.html
          TOOLCHAIN: respec
          W3C_ECHIDNA_TOKEN: ${{ secrets.ECHIDNA_AUTHN_SAML }}
          W3C_WG_DECISION_URL: https://www.w3.org/2026/04/28-lws-minutes.html#0c16
          W3C_BUILD_OVERRIDE: |
             shortName: lws10-authn-saml
             specStatus: WD
